server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    # 优先读环境变量 DB_PASSWORD，未设置时回落到本地开发默认值
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.crm: debug

crm:
  # JWT 签名密钥，生产环境务必用环境变量 CRM_JWT_SECRET 覆盖（至少 32 字节）
  jwt:
    secret: ${CRM_JWT_SECRET:crm-demo-secret-key-please-change-in-production-2026}
  lead:
    pool-days: 15
  customer:
    pool-days: 60
